launch:
- node:
    pkg: foxglove_bridge
    exec: foxglove_bridge
    output: screen

- include:
    file: $(find-pkg-share simdemo)/launch/sim.launch.py

- include:
    file: $(find-pkg-share simdemo)/launch/ekf.yaml

- node:
    pkg: simdemo
    exec: control.py
    output: screen
    param:
      - { name: use_sim_time, value: true }

- node:
    pkg: simdemo
    exec: odomviz.py
    output: screen
    param:
      - { name: use_sim_time, value: true }
